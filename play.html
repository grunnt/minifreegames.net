<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFreeGames - Playing Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">MiniFreeGames</a>
    </header>

    <main>
        <div class="game-container">
            <iframe id="game-frame" class="game-frame" src="" allowfullscreen></iframe>
            
            <div class="game-instructions">
                <h2 id="game-title">Loading Game...</h2>
                <p id="game-desc">Instructions will appear here.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MiniFreeGames.net - Made by Hiddo.</p>
    </footer>

    <script>
        // This script reads the URL to know which game to load in the iframe
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameFile = urlParams.get('game');
            const gameName = urlParams.get('title');
            const gameInstructions = urlParams.get('desc');

            if (gameFile) {
                document.getElementById('game-frame').src = gameFile;
            }
            if (gameName) {
                document.getElementById('game-title').textContent = gameName;
            }
            if (gameInstructions) {
                document.getElementById('game-desc').textContent = gameInstructions;
            }
        });
    </script>
</body>
</html>
