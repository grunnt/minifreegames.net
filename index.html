<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFreeGames.net - Play free games!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
   <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">MiniFreeGames</a>
        <input type="text" class="search-bar" placeholder="Search a game...">
    </header>

    <main>
        <h2>New & Popular</h2>
        <div class="game-grid">
            
			<a href="play.html?game=space_shooter.html&title=Space Shooter&desc=Use the mouse to move and SPACE to shoot! Pick up powerups to shoot faster." class="game-card featured-game">
				<img src="plaatjes/space-war.png" alt="Space Shooter" class="game-image">
				<div class="game-title">Space Shooter</div>
			</a>

			<a href="play.html?game=tank_battle.html&title=Tank Battle&desc=Player 1: WASD to drive and SPACE to shoot. Player 2: IJKL to drive and O to shoot." class="game-card">
				<img src="plaatjes/tank-battle.png" alt="Tank Battle" class="game-image">
				<div class="game-title">Tank Battle (2P)</div>
			</a>
			
			<a href="play.html?game=race_game.html&title=Race Game&desc=Use arrow keys to drive!" class="game-card">
				<img src="plaatjes/race-game.png" alt="Race Game" class="game-image">
				<div class="game-title">Race Game</div>
			</a>
			
			<a href="play.html?game=pong.html&title=Race Game&desc=Control the pad with A and D." class="game-card">
				<img src="plaatjes/pong.png" alt="Pong" class="game-image">
				<div class="game-title">Pong</div>
			</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MiniFreeGames.net - Made by Hiddo.</p>
    </footer>
	<script>
			// Wait for the page to fully load
			document.addEventListener('DOMContentLoaded', () => {
				const searchBar = document.querySelector('.search-bar');
				const gameCards = document.querySelectorAll('.game-card');

				// Listen for any typing in the search bar
				searchBar.addEventListener('input', (e) => {
					const searchTerm = e.target.value.toLowerCase();

					// Loop through all the game cards
					gameCards.forEach(card => {
						const title = card.querySelector('.game-title').textContent.toLowerCase();

						// If the title includes the search term, show it. Otherwise, hide it.
						if (title.includes(searchTerm)) {
							card.style.display = 'flex'; 
						} else {
							card.style.display = 'none';
						}
					});
				});
			});
		</script>
</body>
</html>
